name: Apply evidence-state update
on:
  push:
    branches: [main]
    paths:
      - tools/apply_evidence_state.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5a14715f27a460aee29f1cf9e9efba
      - name: Apply source update
        run: python3 tools/apply_evidence_state.py
      - name: Rebuild generated distributions
        run: python3 tools/build.py
      - name: Verify tests and generated artifacts
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/build.py --check
      - name: Remove one-time migration files
        run: rm tools/apply_evidence_state.py .github/workflows/apply-evidence-state.yml
      - name: Commit evidence-state update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add explicit hypothesis and evidence states"
          git push
