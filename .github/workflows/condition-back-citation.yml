name: Condition back-citation exploration

on:
  push:
    paths:
      - .github/workflows/condition-back-citation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  condition-back-citation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add back-citation exploration rule
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{path} / {label}: expected 1 match, found {n}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "protocol/01.work-contract.md",
              "2. Prior art exploration typically utilizes Google Scholar, PubMed, arXiv, bioRxiv and other scholarly resources related to a topic. Useful strategies include keyword and synonym searches, backward citation tracking, and forward citation chaining.\n3. Abstracts may be used to screen results for relevance to the proposition, but an abstract alone cannot validate a citation or establish claim support. A retained candidate proceeds to `REFERENCE-VALIDATION` only after the complete primary text is obtained and inspected.\n4. Search terms, databases, dates, and results are entered in the search record and attributed to the participant who conducted the search.",
              "2. Prior art exploration typically utilizes Google Scholar, PubMed, arXiv, bioRxiv and other scholarly resources related to a topic. Use keyword and synonym searches together with **back-citation exploration** and forward citation chaining. In back-citation exploration, identify papers asserting a concept closely related to the proposition under study, inspect which sources they cite for that assertion, and follow those citations backward to the underlying primary literature. Continue recursively where useful to identify earlier formulations, methods, evidence, competing interpretations, or the origin of a quantitative or conceptual claim. Complement this with forward citation chaining from important sources to determine how later work used, challenged, narrowed, or reinterpreted them. A citing paper's characterization of an earlier source is a discovery path, not evidence for what the earlier source says.\n3. Record a material citation path when it informs provenance, priority, or interpretation, including the later paper that exposed the path and the earlier candidate sources followed from it. Citation paths can reveal citation inheritance, in which a claim is repeated through later papers without the underlying primary source establishing the same proposition. Do not infer support from repetition or citation count.\n4. Abstracts may be used to screen results for relevance to the proposition, but an abstract alone cannot validate a citation or establish claim support. A retained candidate proceeds to `REFERENCE-VALIDATION` only after the complete primary text is obtained and inspected. Every source retained for claim support is validated from its own pinned complete primary text, regardless of how it was discovered.\n5. Search terms, databases, dates, results, and material citation paths are entered in the search record and attributed to the participant who conducted the search.",
              "protocol back-citation rule",
          )

          # Renumber the remainder of the prior-art list after inserting a new item.
          p = Path("protocol/01.work-contract.md")
          text = p.read_text()
          old = "5. A search returning no relevant results is repeated with alternative terms before absence is recorded. No claim of novelty rests on a single unsuccessful search.\n6. **Searches returning nothing relevant are retained with the same detail as searches that return candidates**: date, databases queried, the exact terms used, and the strategy followed. An absence of prior art is supported only by the searches actually conducted, and only as of the dates on which they were conducted. A null result obtained well before submission is repeated before the claim it supports is released.\n7. The participant that introduced a statement does not conduct the search establishing its lineage. Searches are conducted by a different participant.\n8. Each candidate is recorded as retained, screened out with a reason, or inaccessible. A second participant reviews the search record.\n9. The statement is then narrowed, defended, or withdrawn in light of what the search returned.\n10. Candidates retained are passed to `REFERENCE-VALIDATION` for admission as references.\n11. A statement within the declared coverage released without a recorded search blocks merge and release."
          new = "6. A search returning no relevant results is repeated with alternative terms before absence is recorded. No claim of novelty rests on a single unsuccessful search.\n7. **Searches returning nothing relevant are retained with the same detail as searches that return candidates**: date, databases queried, the exact terms used, and the strategy followed. An absence of prior art is supported only by the searches actually conducted, and only as of the dates on which they were conducted. A null result obtained well before submission is repeated before the claim it supports is released.\n8. The participant that introduced a statement does not conduct the search establishing its lineage. Searches are conducted by a different participant.\n9. Each candidate is recorded as retained, screened out with a reason, or inaccessible. A second participant reviews the search record.\n10. The statement is then narrowed, defended, or withdrawn in light of what the search returned.\n11. Candidates retained are passed to `REFERENCE-VALIDATION` for admission as references.\n12. A statement within the declared coverage released without a recorded search blocks merge and release."
          if text.count(old) != 1:
              raise SystemExit(f"protocol renumber: expected 1 match, found {text.count(old)}")
          p.write_text(text.replace(old, new, 1))

          replace_once(
              "skills/scuter/SKILL.md",
              "2. **PRIOR-ART-LINEAGE.** Establish the User's coverage declaration: FULL, CLAIMS, CITATION, or a recorded custom scope. Conduct and record proposition-specific searches required by that declaration. Preserve null searches and candidate dispositions. A different participant establishes lineage for the introducing participant's claims, as specified by the protocol. Do not infer novelty from an unperformed search.",
              "2. **PRIOR-ART-LINEAGE.** Establish the User's coverage declaration: FULL, CLAIMS, CITATION, or a recorded custom scope. Conduct and record proposition-specific searches required by that declaration. Use keyword/synonym searching, back-citation exploration, and forward citation chaining. For back-citation exploration, find papers asserting closely related concepts, inspect the references they cite for those assertions, and follow those references backward to the underlying primary literature; continue recursively where useful and record material citation paths. Treat the later citing paper only as a discovery route. Repetition through a citation chain does not establish support, and every retained source must still be validated from its own pinned complete primary text under `REFERENCE-VALIDATION`. Preserve null searches and candidate dispositions. A different participant establishes lineage for the introducing participant's claims, as specified by the protocol. Do not infer novelty from an unperformed search.",
              "skill prior-art directive",
          )

          replace_once(
              "docs/implementation-guide.md",
              "Read and adapt the [work contract](../protocol/01.work-contract.md). Its S8 template records project-specific roles, locations, scope, evidence classes, acceptance criteria, and release requirements. Select a prior-art search coverage declaration and record it. Maintain the search record separately from the claim-specific citation ledger.",
              "Read and adapt the [work contract](../protocol/01.work-contract.md). Its S8 template records project-specific roles, locations, scope, evidence classes, acceptance criteria, and release requirements. Select a prior-art search coverage declaration and record it. Maintain the search record separately from the claim-specific citation ledger. Use back-citation exploration as an explicit prior-art method: when a paper asserts a concept closely related to the proposition, inspect the references attached to that assertion and follow them backward to the primary literature, recursively where useful. Pair this with forward citation chaining from important sources. Record material citation paths when they inform provenance, priority, or interpretation. A later paper's description of an earlier source is discovery evidence only; the earlier source must be read and validated from its own complete primary text before it can support a claim.",
              "implementation prior-art guidance",
          )

          replace_once(
              "docs/record-and-review.md",
              "Novelty and priority statements require the applicable prior-art search in addition to citations.",
              "Novelty and priority statements require the applicable prior-art search in addition to citations. When prior-art work used back-citation or forward-citation exploration, review the recorded citation path and verify that claim support was not inherited from a later paper's characterization of an earlier source. Repeated citation of a proposition is not a substitute for inspecting the underlying primary text.",
              "review citation-chain check",
          )

          test = '''import unittest\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\n\nclass BackCitationContractTests(unittest.TestCase):\n    def test_protocol_requires_back_citation_exploration(self):\n        text = (ROOT / "protocol/01.work-contract.md").read_text()\n        self.assertIn("back-citation exploration", text)\n        self.assertIn("citation inheritance", text)\n        self.assertIn("discovery path, not evidence", text)\n        self.assertIn("material citation paths", text)\n\n    def test_skill_preserves_primary_text_boundary(self):\n        text = (ROOT / "skills/scuter/SKILL.md").read_text()\n        self.assertIn("back-citation exploration", text)\n        self.assertIn("discovery route", text)\n        self.assertIn("validated from its own pinned complete primary text", text)\n\n    def test_guidance_pairs_backward_and_forward_chaining(self):\n        impl = (ROOT / "docs/implementation-guide.md").read_text()\n        review = (ROOT / "docs/record-and-review.md").read_text()\n        self.assertIn("forward citation chaining", impl)\n        self.assertIn("recorded citation path", review)\n        self.assertIn("Repeated citation", review)\n\nif __name__ == "__main__":\n    unittest.main()\n'''
          Path("tests/test_back_citation_contract.py").write_text(test)
          PY

      - name: Rebuild distributions
        run: python tools/build.py

      - name: Run tests and generated-artifact check
        run: |
          python -m unittest discover -s tests
          python tools/build.py --check
          git diff --check

      - name: Commit conditioned 0.2.2-dev package
        shell: bash
        run: |
          git rm .github/workflows/condition-back-citation.yml
          git add protocol/01.work-contract.md skills/scuter/SKILL.md skills/scuter/references docs tests dist
          git diff --cached --check
          git commit -m "Add back-citation exploration to prior-art lineage"
          echo "PACKAGE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push

      - name: Pin public downloads to conditioned package
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          commit = os.environ["PACKAGE_COMMIT"]
          pattern = re.compile(r"https://raw\.githubusercontent\.com/TaylorResearchLab/SCUTER/[0-9a-f]{40}/dist/(scuter-v0\.2\.2-dev\.(?:skill|md))")
          for name in ["README.md", "QUICKSTART.md"]:
              path = Path(name)
              text = path.read_text()
              text, n = pattern.subn(lambda m: f"https://raw.githubusercontent.com/TaylorResearchLab/SCUTER/{commit}/dist/{m.group(1)}", text)
              if n < 2:
                  raise SystemExit(f"{name}: expected at least 2 download links, found {n}")
              path.write_text(text)
          PY
          git add README.md QUICKSTART.md
          git diff --cached --check
          git commit -m "Point docs to back-citation build"
          git push
