name: Build approved notebook traceability candidate

on:
  push:
    branches:
      - agent/notebook-traceability
    paths:
      - '.github/workflows/bootstrap-notebook.yml'

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: agent/notebook-traceability
          fetch-depth: 0

      - name: Reconstruct and verify approved source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .scuter-bootstrap/part-00 .scuter-bootstrap/part-01 .scuter-bootstrap/part-02 > /tmp/scuter-notebook-source.patch
          echo '86543b6929ffa3514e0d89c5a4fb8cdbd6856426871b4ab4d46a689008514193  /tmp/scuter-notebook-source.patch' | sha256sum -c -
          git apply --check /tmp/scuter-notebook-source.patch
          git apply --index /tmp/scuter-notebook-source.patch

      - name: Build and verify distributions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build.py
          python3 tools/build.py --check
          python3 -m unittest discover -s tests -v
          git diff --check

      - name: Remove bootstrap and commit exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .scuter-bootstrap
          git rm .github/workflows/bootstrap-notebook.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add notebook traceability and session provenance'
          git push origin HEAD:agent/notebook-traceability
