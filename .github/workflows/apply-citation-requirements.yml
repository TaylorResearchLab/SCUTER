name: Apply citation requirements
on:
  push:
    branches: [main]
    paths:
      - tools/apply_citation_requirements.py
      - .github/workflows/apply-citation-requirements.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply source update
        run: python3 tools/apply_citation_requirements.py
      - name: Rebuild generated distributions
        run: python3 tools/build.py
      - name: Verify tests and generated artifacts
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/build.py --check
      - name: Remove one-time migration files
        run: rm tools/apply_citation_requirements.py .github/workflows/apply-citation-requirements.yml
      - name: Commit citation requirements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add explicit scientific citation requirements"
          git push
