name: Apply source-text citation gate
on:
  push:
    branches: [main]
    paths:
      - tools/apply_source_text_citation_gate.py
      - .github/workflows/apply-source-text-citation-gate.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply source-text citation gate
        run: python3 tools/apply_source_text_citation_gate.py
      - name: Rebuild generated distributions
        run: python3 tools/build.py
      - name: Verify tests and generated artifacts
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/build.py --check
      - name: Remove one-time migration files
        run: rm tools/apply_source_text_citation_gate.py .github/workflows/apply-source-text-citation-gate.yml
      - name: Commit conditioned 0.2.2-dev package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Require cited source-text inspection"
          git push
