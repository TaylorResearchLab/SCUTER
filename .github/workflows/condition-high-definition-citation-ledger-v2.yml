name: Condition high-definition Citation Validation Ledger v2

on:
  push:
    paths:
      - .github/workflows/condition-high-definition-citation-ledger-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  condition-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply high-definition ledger model
        run: python tools/condition_high_definition_ledger.py

      - name: Rebuild distributions
        run: python tools/build.py

      - name: Run tests and generated-artifact check
        run: |
          python -m unittest discover -s tests
          python tools/build.py --check

      - name: Commit conditioned 0.2.2-dev package
        shell: bash
        run: |
          git rm .github/workflows/condition-high-definition-citation-ledger.yml
          git rm .github/workflows/condition-high-definition-citation-ledger-v2.yml
          git rm tools/condition_high_definition_ledger.py
          git add protocol/01.work-contract.md skills/scuter/SKILL.md skills/scuter/references docs tests dist
          git diff --cached --check
          git commit -m "Strengthen Citation Validation Ledger"
          echo "PACKAGE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push

      - name: Pin public downloads to conditioned package
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          commit = os.environ["PACKAGE_COMMIT"]
          pattern = re.compile(r"https://raw\.githubusercontent\.com/TaylorResearchLab/SCUTER/[0-9a-f]{40}/dist/(scuter-v0\.2\.2-dev\.(?:skill|md))")
          for name in ["README.md", "QUICKSTART.md"]:
              path = Path(name)
              text = path.read_text()
              text, n = pattern.subn(lambda m: f"https://raw.githubusercontent.com/TaylorResearchLab/SCUTER/{commit}/dist/{m.group(1)}", text)
              if n < 2:
                  raise SystemExit(f"{name}: expected at least 2 conditioned download links, found {n}")
              path.write_text(text)
          PY
          git add README.md QUICKSTART.md
          git diff --cached --check
          git commit -m "Point docs to high-definition ledger build"
          git push

      - name: Final verification
        run: |
          python -m unittest discover -s tests
          python tools/build.py --check
          test -z "$(git status --short)"
