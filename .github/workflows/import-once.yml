name: Import SCUTER snapshot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-once.yml'
      - 'tools/import_from_paper.py'
      - 'provenance/import-plan.json'
permissions:
  contents: write
concurrency:
  group: scuter-initial-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'TaylorResearchLab/SCUTER'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out bootstrap revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Import and verify exact public snapshot
        run: python3 tools/import_from_paper.py
      - name: Repeat checks from local bytes
        run: python3 tools/import_from_paper.py --check
      - name: Commit allowlisted migration outputs
        shell: bash
        run: |
          set -euo pipefail
          git add -- skills protocol docs LICENSE.md LICENSE-CC0.md provenance/import-report.json
          if git diff --cached --quiet; then
            echo "Snapshot already present; no commit needed."
            exit 0
          fi
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Import verified SCUTER artifacts from paper snapshot 32be4c5" -m "User-authorized byte-preserving import. Origin paths and hashes: provenance/import-plan.json. Execution and member checks: provenance/import-report.json. Existing v0.1.0 identity retained; no release or protocol reconciliation."
          git push origin HEAD:main
