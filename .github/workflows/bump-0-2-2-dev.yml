name: Bump SCUTER 0.2.2-dev
on:
  push:
    branches: [main]
    paths:
      - tools/bump_0_2_2_dev.py
      - .github/workflows/bump-0-2-2-dev.yml
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply version and label update
        run: python3 tools/bump_0_2_2_dev.py
      - name: Rebuild generated distributions
        run: python3 tools/build.py
      - name: Verify tests and generated artifacts
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/build.py --check
      - name: Commit 0.2.2-dev package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION skills protocol docs dist
          git commit -m "Bump SCUTER to 0.2.2-dev"
          git push
      - name: Pin public download links to 0.2.2-dev package commit
        run: |
          PACKAGE_SHA=$(git rev-parse HEAD)
          python3 - "$PACKAGE_SHA" <<'PY'
          from pathlib import Path
          import sys
          sha = sys.argv[1]
          for rel in ["README.md", "QUICKSTART.md"]:
              p = Path(rel)
              t = p.read_text()
              t = t.replace("scuter-v0.2.1-dev.skill", "scuter-v0.2.2-dev.skill")
              t = t.replace("scuter-v0.2.1-dev.md", "scuter-v0.2.2-dev.md")
              import re
              t = re.sub(r"SCUTER/[0-9a-f]{40}/dist/scuter-v0\.2\.2-dev\.skill", f"SCUTER/{sha}/dist/scuter-v0.2.2-dev.skill", t)
              t = re.sub(r"SCUTER/[0-9a-f]{40}/dist/scuter-v0\.2\.2-dev\.md", f"SCUTER/{sha}/dist/scuter-v0.2.2-dev.md", t)
              p.write_text(t)
          PY
          rm tools/bump_0_2_2_dev.py .github/workflows/bump-0-2-2-dev.yml
          git add -A
          git commit -m "Point docs to SCUTER 0.2.2-dev package"
          git push
